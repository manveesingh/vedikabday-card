<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>happy 20th, vedhu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8CA;
    --cream-2:#FFFCE8;
    --sky:#CDE3E8;
    --sky-2:#E4F1F3;
    --red:#6B0B0C;
    --brown:#2D120D;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 20%, rgba(205,227,232,0.55), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(107,11,12,0.08), transparent 40%),
      var(--sky-2);
    font-family:'Quicksand',sans-serif;
    color:var(--brown);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 16px 40px;
    overflow-x:hidden;
  }
  .intro{
    text-align:center;
    max-width:520px;
    margin-bottom:18px;
  }
  .intro .tag{
    font-family:'Caveat',cursive;
    font-size:26px;
    color:var(--red);
    display:block;
    margin-bottom:2px;
  }
  .intro h1{
    font-family:'Caveat',cursive;
    font-size:44px;
    font-weight:700;
    margin:0 0 4px;
    color:var(--brown);
    letter-spacing:0.5px;
  }
  .intro p{
    margin:0;
    font-size:14px;
    opacity:0.72;
    line-height:1.5;
  }

  .stage{
    width:min(94vw, 900px);
    aspect-ratio:3/2;
    position:relative;
    perspective:2600px;
  }

  .book{
    position:absolute;
    inset:0;
    border-radius:14px;
    box-shadow:0 22px 55px rgba(45,18,13,0.28), 0 4px 14px rgba(45,18,13,0.15);
  }

  .page{
    position:absolute;
    inset:0;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform 0.85s cubic-bezier(.6,.05,.28,1);
    border-radius:14px;
    overflow:hidden;
    will-change:transform;
  }
  .page.flipped{
    transform:rotateY(-179.5deg);
  }
  .page::after{
    /* spine shadow */
    content:"";
    position:absolute;
    top:0; left:0; bottom:0;
    width:36px;
    background:linear-gradient(to right, rgba(45,18,13,0.16), transparent);
    pointer-events:none;
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    display:flex;
  }
  .face.back{
    transform:rotateY(180deg);
  }

  /* ambient sky + cloud dots on every card face */
  .face{
    background:var(--cream);
  }
  .face.sky{ background:var(--sky); }

  .cloud{
    position:absolute;
    opacity:0.5;
  }

  .plane-trail{
    position:absolute;
    stroke:var(--red);
    stroke-width:2;
    stroke-dasharray:6 7;
    fill:none;
    opacity:0.55;
  }

  /* --- page content layouts --- */
  .content{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
  }
  .pad{ padding:clamp(18px,3.6vw,40px); }

  .half{ width:50%; height:100%; position:relative; display:flex; flex-direction:column; }
  .half.divider-right{ border-right:1.5px dashed rgba(45,18,13,0.22); }
  .half.divider-left{ border-left:1.5px dashed rgba(45,18,13,0.22); }

  .photo-fill{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-frame{
    position:relative;
    background:var(--cream-2);
    border:6px solid var(--cream-2);
    box-shadow:0 3px 10px rgba(45,18,13,0.18);
    overflow:hidden;
  }

  .script{ font-family:'Caveat',cursive; }
  .eyebrow-none{ display:none; }

  h2.pagehead{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:clamp(26px,4.4vw,42px);
    margin:0 0 6px;
    color:var(--red);
    line-height:1.05;
  }
  p.body-txt{
    font-size:clamp(11.5px,1.7vw,15px);
    line-height:1.55;
    margin:0 0 10px;
    color:var(--brown);
  }

  /* cover */
  .cover-face{
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
  }
  .cover-face .stripes{
    position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, var(--sky) 0 26px, var(--cream) 26px 52px);
    opacity:0.9;
  }
  .cover-inner{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:20px;
  }
  .cover-title{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:clamp(34px,7vw,64px);
    color:var(--red);
    line-height:1;
    text-shadow:0 2px 0 rgba(255,255,255,0.4);
  }
  .cover-sub{
    font-size:clamp(11px,1.8vw,15px);
    letter-spacing:0.5px;
    color:var(--brown);
    background:var(--cream-2);
    padding:5px 14px;
    border-radius:100px;
    border:1.5px solid rgba(107,11,12,0.25);
  }
  .cover-photo{
    width:clamp(120px,26vw,190px);
    aspect-ratio:1;
    border-radius:50%;
    object-fit:cover;
    border:5px solid var(--cream-2);
    box-shadow:0 8px 20px rgba(45,18,13,0.28);
  }
  .cover-hint{
    position:absolute;
    bottom:16px; left:0; right:0;
    text-align:center;
    font-size:11.5px;
    color:var(--brown);
    opacity:0.55;
    z-index:2;
    font-family:'Quicksand';
  }

  /* boarding pass */
  .ticket{
    width:100%; height:100%;
    background:var(--cream);
    display:flex;
    padding:clamp(16px,3vw,30px);
    gap:0;
  }
  .ticket-main{
    flex:1;
    border:2px dashed var(--red);
    border-right:none;
    border-radius:12px 0 0 12px;
    padding:clamp(14px,2.6vw,26px);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .ticket-stub{
    width:clamp(70px,15vw,110px);
    border:2px dashed var(--red);
    border-left:none;
    border-radius:0 12px 12px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--sky-2);
    padding:8px;
  }
  .bp-label{ font-size:9px; letter-spacing:1px; opacity:0.55; }
  .bp-row{ display:flex; justify-content:space-between; align-items:flex-end; }
  .bp-big{ font-family:'Caveat',cursive; font-weight:700; font-size:clamp(28px,5vw,48px); color:var(--red); line-height:1; }
  .bp-field{ font-size:clamp(11px,1.8vw,15px); font-weight:600; }
  .dots-row{ letter-spacing:3px; color:var(--red); font-size:10px; writing-mode:vertical-rl; }

  /* milestone */
  .milestone-face{ align-items:center; justify-content:center; position:relative; }
  .milestone-num{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:clamp(90px,17vw,160px);
    color:var(--red);
    line-height:0.8;
    text-align:center;
  }
  .milestone-cap{ text-align:center; max-width:80%; margin:0 auto; }

  /* checklist */
  ul.checklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  ul.checklist li{
    display:flex; align-items:flex-start; gap:9px;
    font-size:clamp(11.5px,1.7vw,14.5px);
    line-height:1.4;
  }
  ul.checklist li .box{
    flex:none;
    width:16px;height:16px;
    border:2px solid var(--red);
    border-radius:4px;
    margin-top:1px;
    position:relative;
  }
  ul.checklist li .box::after{
    content:"";
    position:absolute;
    left:3px; top:-1px;
    width:4px; height:8px;
    border-right:2px solid var(--red);
    border-bottom:2px solid var(--red);
    transform:rotate(40deg);
  }

  /* dial (clock/altimeter) */
  .dial{
    width:clamp(100px,20vw,160px);
    aspect-ratio:1;
    border-radius:50%;
    background:var(--cream-2);
    border:6px solid var(--red);
    position:relative;
    box-shadow:inset 0 0 0 2px rgba(107,11,12,0.15);
  }
  .dial .needle{
    position:absolute; left:50%; top:50%;
    width:3px; height:33%;
    background:var(--brown);
    transform-origin:bottom center;
  }
  .dial .hub{
    position:absolute; left:50%; top:50%;
    width:9px; height:9px; border-radius:50%;
    background:var(--red);
    transform:translate(-50%,-50%);
  }
  .dial .tick{
    position:absolute; left:50%; top:6%;
    width:2px; height:9%;
    background:var(--brown);
    opacity:0.55;
    transform-origin:bottom center;
  }

  .trio-photos{ display:flex; flex-direction:column; gap:8px; height:100%; }
  .trio-photos img{ width:100%; height:100%; object-fit:cover; border-radius:8px; box-shadow:0 3px 8px rgba(45,18,13,0.18); }

  /* letter */
  .letter-face{ align-items:flex-start; }
  .letter-body{
    font-family:'Caveat',cursive;
    font-size:clamp(15px,2.6vw,21px);
    line-height:1.5;
    color:var(--brown);
  }
  .letter-body p{ margin:0 0 10px; }
  .sign{ text-align:right; font-size:clamp(18px,3vw,26px); color:var(--red); margin-top:6px; }

  /* closing */
  .close-face{ align-items:center; justify-content:center; text-align:center; position:relative; }
  .close-title{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:clamp(30px,6vw,54px);
    color:var(--red);
    line-height:1.05;
  }

  /* nav */
  .nav{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:20px;
  }
  .nav button{
    font-family:'Quicksand';
    font-weight:600;
    font-size:14px;
    background:var(--cream-2);
    color:var(--red);
    border:1.5px solid rgba(107,11,12,0.35);
    padding:9px 18px;
    border-radius:100px;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .nav button:hover{ background:var(--sky); }
  .nav button:active{ transform:scale(0.94); }
  .nav button:disabled{ opacity:0.35; cursor:default; }
  .nav button:disabled:hover{ background:var(--cream-2); }
  .dots{ display:flex; gap:6px; }
  .dots span{
    width:7px;height:7px;border-radius:50%;
    background:rgba(45,18,13,0.22);
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .dots span.on{ background:var(--red); transform:scale(1.25); }

  .edge-tap{
    position:absolute;
    top:0; bottom:0;
    width:18%;
    z-index:5;
    cursor:pointer;
  }
  .edge-tap.right{ right:0; }
  .edge-tap.left{ left:0; }

  @media (prefers-reduced-motion: reduce){
    .page{ transition:none; }
  }

  footer.credit{
    margin-top:16px;
    font-size:11px;
    opacity:0.45;
    text-align:center;
  }
</style>
</head>
<body>

<div class="intro">
  <span class="tag">now boarding</span>
  <h1>happy 20th, vedhu</h1>
  <p>tap the edges of the card (or use the buttons below) to flip through</p>
</div>

<div class="stage">
  <div class="book" id="book"></div>
  <div class="edge-tap left" id="tapLeft"></div>
  <div class="edge-tap right" id="tapRight"></div>
</div>

<div class="nav">
  <button id="prevBtn" aria-label="previous page">◂ back</button>
  <div class="dots" id="dots"></div>
  <button id="nextBtn" aria-label="next page">next ▸</button>
</div>

<footer class="credit">made with love, just for you</footer>

function cloudSvg(cls){
  return `<svg class="${cls}" viewBox="0 0 120 60" width="90" style="opacity:.5"><path d="M20 45 Q5 45 5 32 Q5 20 18 20 Q20 8 35 8 Q50 8 53 20 Q68 18 70 32 Q70 45 55 45 Z" fill="#ffffff"/></svg>`;

function trailSvg(){
  return `<svg class="plane-trail" viewBox="0 0 300 120" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"><path d="M-10 100 Q 90 20 320 40"/></svg>`;
}

function trailSvgInline(){
  return `<svg viewBox="0 0 200 40" width="100%" height="30" preserveAspectRatio="none" style="display:block"><path d="M0 30 Q100 -5 200 15" fill="none" stroke="#6B0B0C" stroke-width="2" stroke-dasharray="5 6" opacity="0.6"/></svg>`;
}

const book = document.getElementById('book');
const dotsWrap = document.getElementById('dots');
let current = 0;

pages.forEach((html, i) => {
  const p = document.createElement('div');
  p.className = 'page';
  p.style.zIndex = pages.length - i;
  p.innerHTML = html;
  book.appendChild(p);

  const d = document.createElement('span');
  dotsWrap.appendChild(d);
});

const pageEls = Array.from(book.querySelectorAll('.page'));
const dotEls = Array.from(dotsWrap.querySelectorAll('span'));

function updateDots(){
  dotEls.forEach((d,i)=> d.classList.toggle('on', i===current));
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===pages.length-1;
}

function next(){
  if(current >= pages.length-1) return;
  pageEls[current].classList.add('flipped');
  pageEls[current].style.zIndex = 1;
  current++;
  updateDots();
}
function prev(){
  if(current <= 0) return;
  current--;
  pageEls[current].classList.remove('flipped');
  pageEls[current].style.zIndex = pages.length - current;
  updateDots();
}

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('tapRight').addEventListener('click', next);
document.getElementById('tapLeft').addEventListener('click', prev);
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') next();
  if(e.key==='ArrowLeft') prev();
});

updateDots();
</script>
